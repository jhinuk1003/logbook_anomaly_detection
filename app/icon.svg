<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Glassmorphic Background Gradient -->
    <radialGradient id="glassGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b81d48" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#700922" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2a030c" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Gold Metallic Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f5e09d"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#8a6713"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Glass Ring Shadow -->
  <circle cx="32" cy="32" r="30" fill="#09060f" opacity="0.6"/>

  <!-- Gold Victorian Rim -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldRim)" stroke-width="2.5"/>

  <!-- Inner Wax Seal Glass Face -->
  <circle cx="32" cy="32" r="26" fill="url(#glassGlow)"/>

  <!-- Glass Sheen Overlay (Top Half) -->
  <path d="M 8 30 A 24 24 0 0 1 56 30 A 24 16 0 0 0 8 30 Z" fill="url(#glassSheen)"/>

  <!-- Victorian Fleur-de-lis / Telemetry Glyph (Embossed Gold) -->
  <g fill="url(#goldRim)">
    <!-- Central Spear -->
    <path d="M 32 14 C 31 20 28 26 25 28 C 29 29 32 34 32 40 C 32 34 35 29 39 28 C 36 26 33 20 32 14 Z"/>
    <!-- Left Petal -->
    <path d="M 23 26 C 18 25 15 28 16 32 C 18 36 23 35 26 31 C 24 29 23 27 23 26 Z"/>
    <!-- Right Petal -->
    <path d="M 41 26 C 46 25 49 28 48 32 C 46 36 41 35 38 31 C 40 29 41 27 41 26 Z"/>
    <!-- Horizontal Cross Band -->
    <rect x="20" y="32" width="24" height="2.5" rx="1.2" fill="#ffd700"/>
    <!-- Lower Base Flare -->
    <path d="M 27 36 C 29 42 31 46 32 48 C 33 46 35 42 37 36 Z"/>
    <!-- Telemetry Pulse Dots -->
    <circle cx="32" cy="51" r="1.5" fill="#f5ecd7"/>
    <circle cx="28" cy="51" r="1" fill="#f5ecd7" opacity="0.8"/>
    <circle cx="36" cy="51" r="1" fill="#f5ecd7" opacity="0.8"/>
  </g>
</svg>
